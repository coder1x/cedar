compressionLevel: mixed

enableGlobalCache: false

enableInlineHunks: 1

enableScripts: true

enableTelemetry: 0

nodeLinker: pnp

npmAuthToken: "${NPM_TOKEN:-}"

packageExtensions:
  eslint-plugin-prettier@*:
    dependencies:
      eslint-config-prettier: "*"

yarnPath: .yarn/releases/yarn-4.13.0.cjs
